<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Group Manager</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>

    * {
      -webkit-tap-highlight-color: transparent;
    }

    body {
      overscroll-behavior: none;
    }

    /* --------------------------------
       User Chip
    -------------------------------- */

    .user-chip {
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      cursor: grab;

      transition:
        transform 0.12s,
        opacity 0.12s;
    }

    .user-chip:active {
      cursor: grabbing;
    }

    .user-chip.dragging {
      opacity: 0.35;
      transform: scale(0.95);
    }


    /* --------------------------------
       Group Drop Zone
    -------------------------------- */

    .group-drop-zone {
      transition:
        background-color 0.15s,
        border-color 0.15s;
    }

    .group-drop-zone.drag-over {
      background-color: #eff6ff;
      border-color: #60a5fa;
    }


    /* --------------------------------
       Available Drop Zone
    -------------------------------- */

    .available-drop-zone {
      transition:
        background-color 0.15s,
        border-color 0.15s;
    }

    .available-drop-zone.drag-over {
      background-color: #f0fdf4;
      border-color: #4ade80;
    }


    /* --------------------------------
       Delete Drop Zone
    -------------------------------- */

    .delete-drop-zone {
      transition:
        background-color 0.15s,
        border-color 0.15s;
    }

    .delete-drop-zone.drag-over {
      background-color: #fef2f2;
      border-color: #f87171;
    }


    /* --------------------------------
       Touch Drag Preview
    -------------------------------- */

    .drag-preview {
      position: fixed;

      z-index: 9999;

      pointer-events: none;

      opacity: 0.9;

      transform:
        translate(-50%, -50%)
        scale(1.03);
    }


    /* --------------------------------
       Drop Indicator
    -------------------------------- */

    .drop-indicator {
      width: 3px;

      min-width: 3px;

      height: 38px;

      background: #3b82f6;

      border-radius: 999px;

      pointer-events: none;
    }


    /* --------------------------------
       Input
    -------------------------------- */

    .group-name-input {
      width: 70px;

      text-align: center;

      border: 1px solid #d1d5db;

      border-radius: 6px;

      padding: 2px 6px;

      font-size: 13px;

      font-weight: 600;

      background: white;

      outline: none;
    }

    .group-name-input:focus {
      border-color: #60a5fa;
      box-shadow:
        0 0 0 1px #60a5fa;
    }


    /* --------------------------------
       New User Input
    -------------------------------- */

    .new-user-input {
      width: 120px;

      border: 1px solid #d1d5db;

      border-radius: 8px;

      padding: 8px 10px;

      font-size: 14px;

      outline: none;
    }

    .new-user-input:focus {
      border-color: #60a5fa;

      box-shadow:
        0 0 0 1px #60a5fa;
    }

  </style>

</head>


<body
  class="
    bg-gray-100
    text-gray-800
    min-h-screen
  "
>


  <!-- =====================================================
       TOP BAR
  ====================================================== -->

  <header
    class="
      bg-white
      border-b
      shadow-sm
    "
  >

    <div
      class="
        max-w-5xl
        mx-auto
        px-4
        py-3
      "
    >

      <div
        class="
          flex
          justify-end
          items-center
          gap-2
        "
      >

        <!-- Add Group -->

        <button
          id="addGroupBtn"
          class="
            px-3
            py-2
            rounded-lg
            bg-blue-500
            text-white
            text-sm
            font-semibold
            active:scale-95
          "
        >
          + Group
        </button>


        <!-- Copy -->

        <button
          id="copyBtn"
          class="
            px-3
            py-2
            rounded-lg
            bg-gray-200
            text-gray-700
            text-sm
            font-semibold
            active:scale-95
          "
        >
          Copy
        </button>


        <!-- Reset -->

        <button
          id="resetBtn"
          class="
            px-3
            py-2
            rounded-lg
            bg-gray-200
            text-gray-700
            text-sm
            font-semibold
            active:scale-95
          "
        >
          Reset
        </button>

      </div>

    </div>

  </header>



  <!-- =====================================================
       MAIN
  ====================================================== -->

  <main
    class="
      max-w-5xl
      mx-auto
      px-3
      py-4
    "
  >


    <!-- ===================================================
         GROUPS
    ==================================================== -->

    <div
      id="groupsContainer"
      class="space-y-4"
    ></div>



    <!-- ===================================================
         AVAILABLE USERS
    ==================================================== -->

    <section
      class="
        mt-6
        bg-white
        rounded-xl
        border
        shadow-sm
        overflow-hidden
      "
    >

      <!-- Available Header -->

      <div
        class="
          flex
          items-center
          justify-between
          gap-3
          px-4
          py-3
          bg-gray-50
          border-b
        "
      >

        <div>

          <div
            class="
              font-bold
              text-base
            "
          >
            Available Users
          </div>

          <div
            class="
              text-xs
              text-gray-500
              mt-1
            "
          >
            Drag users into a group
          </div>

        </div>


        <div
          class="
            flex
            items-center
            gap-3
          "
        >

          <span
            id="availableCount"
            class="
              text-xs
              text-gray-500
              font-semibold
            "
          ></span>


          <!-- Delete Zone -->

          <div
            id="availableDeleteZone"
            class="
              delete-drop-zone
              px-3
              py-2
              rounded-lg
              border
              border-red-200
              text-red-500
              text-xs
              font-semibold
              whitespace-nowrap
            "
          >
            Delete
          </div>

        </div>

      </div>



      <!-- Available Drop Zone -->

      <div
        id="availableUsers"
        class="
          available-drop-zone
          p-4
          min-h-[110px]
          flex
          flex-wrap
          items-start
          content-start
          gap-2
          border-2
          border-transparent
        "
      ></div>

    </section>


  </main>


  <!-- JavaScript -->

  <script src="script.js"></script>

</body>

</html>
